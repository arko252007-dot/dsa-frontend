<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA with C - Tree Visualization</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .tree-container {
            height: 400px;
            background-color: var(--bs-light);
            border-radius: 10px;
            border: 1px solid #dee2e6;
            position: relative;
            overflow: hidden;
        }
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .tree-line {
            stroke: var(--bs-secondary);
            stroke-width: 2;
            transition: stroke 0.3s, stroke-width 0.3s;
        }
        .tree-line.highlight {
            stroke: var(--bs-warning);
            stroke-width: 4;
        }
        .tree-node {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: white;
            border: 2px solid var(--bs-primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            transform: translate(-50%, -50%);
            z-index: 2;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.5s;
        }
        .tree-node.highlight {
            border-color: var(--bs-warning);
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.8);
            background-color: #fff3cd;
        }
        .tree-node.new-node {
            border-color: var(--bs-success);
            background-color: #d1e7dd;
        }
        .code-block {
            background-color: #282c34;
            color: #abb2bf;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            height: 400px;
            overflow-y: auto;
            white-space: pre;
        }
        .code-line {
            padding: 2px 5px;
            border-radius: 3px;
        }
        .code-line.active {
            background-color: #3e4451;
            color: #e5c07b;
            font-weight: bold;
            border-left: 3px solid #e5c07b;
        }
        .traversal-output {
            min-height: 40px;
            font-family: monospace;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-danger mb-0">Binary Search Tree Visualization</h2>
            <a href="visualization.html" class="btn btn-outline-secondary rounded-pill shadow-sm"><i class="bi bi-arrow-left"></i> Back</a>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 h-100" style="border-radius: 15px;">
                    <div class="card-body p-4 d-flex flex-column">
                        <div class="row g-2 mb-3 align-items-end">
                            <div class="col-md-3">
                                <label class="form-label fw-bold small text-muted">Node Value:</label>
                                <input type="number" id="nodeValue" class="form-control" placeholder="e.g. 50">
                            </div>
                            <div class="col-md-9 d-flex gap-2 flex-wrap">
                                <button id="btnInsert" class="btn btn-danger rounded-pill flex-grow-1 shadow-sm fw-bold">Insert Node</button>
                                <button id="btnInorder" class="btn btn-outline-danger rounded-pill shadow-sm">Inorder</button>
                                <button id="btnPreorder" class="btn btn-outline-danger rounded-pill shadow-sm">Preorder</button>
                                <button id="btnPostorder" class="btn btn-outline-danger rounded-pill shadow-sm">Postorder</button>
                                <button id="btnClear" class="btn btn-outline-secondary rounded-pill shadow-sm">Clear</button>
                            </div>
                        </div>
                        
                        <div class="bg-dark text-white p-2 rounded mb-3 text-center traversal-output" id="traversalOutput">
                            Traversal Output: [ ]
                        </div>

                        <div class="tree-container" id="treeContainer">
                            <svg id="treeSvg"></svg>
                            <!-- Nodes injected here -->
                        </div>
                        
                        <div class="text-center mt-3">
                            <h5 id="statusText" class="text-muted fw-semibold mb-0">Tree is empty. Insert a node.</h5>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-lg border-0 h-100" style="border-radius: 15px;">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3"><i class="bi bi-terminal"></i> Dry Run Code</h5>
                        <div class="code-block" id="codeBlock">Select an operation to see the code.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="nav-script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const treeContainer = document.getElementById('treeContainer');
            const treeSvg = document.getElementById('treeSvg');
            const nodeValueInput = document.getElementById('nodeValue');
            const btnInsert = document.getElementById('btnInsert');
            const btnInorder = document.getElementById('btnInorder');
            const btnPreorder = document.getElementById('btnPreorder');
            const btnPostorder = document.getElementById('btnPostorder');
            const btnClear = document.getElementById('btnClear');
            const statusText = document.getElementById('statusText');
            const codeBlock = document.getElementById('codeBlock');
            const traversalOutput = document.getElementById('traversalOutput');

            let root = null;
            let isAnimating = false;
            let nodeCounter = 0;

            const codeSnippets = {
                insert: [
                    "struct Node* insert(struct Node* node, int val) {",
                    "    if (node == NULL) {",
                    "        return createNode(val);",
                    "    }",
                    "    if (val < node->data) {",
                    "        node->left = insert(node->left, val);",
                    "    } else if (val > node->data) {",
                    "        node->right = insert(node->right, val);",
                    "    }",
                    "    return node;",
                    "}"
                ],
                inorder: [
                    "void inorder(struct Node* node) {",
                    "    if (node != NULL) {",
                    "        inorder(node->left);",
                    "        printf(\"%d \", node->data);",
                    "        inorder(node->right);",
                    "    }",
                    "}"
                ],
                preorder: [
                    "void preorder(struct Node* node) {",
                    "    if (node != NULL) {",
                    "        printf(\"%d \", node->data);",
                    "        preorder(node->left);",
                    "        preorder(node->right);",
                    "    }",
                    "}"
                ],
                postorder: [
                    "void postorder(struct Node* node) {",
                    "    if (node != NULL) {",
                    "        postorder(node->left);",
                    "        postorder(node->right);",
                    "        printf(\"%d \", node->data);",
                    "    }",
                    "}"
                ]
            };

            const sleep = ms => new Promise(r => setTimeout(r, ms));

            function renderCode(type) {
                codeBlock.innerHTML = codeSnippets[type].map((line, i) => `<div class="code-line" id="line-${i}">${line.replace(/ /g, '&nbsp;')}</div>`).join('');
            }

            function highlightLine(lineNum) {
                document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
                if (lineNum !== undefined && lineNum >= 0) {
                    const line = document.getElementById(`line-${lineNum}`);
                    if (line) {
                        line.classList.add('active');
                        line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }

            class TreeNode {
                constructor(val, x, y, level) {
                    this.val = val;
                    this.x = x;
                    this.y = y;
                    this.level = level;
                    this.left = null;
                    this.right = null;
                    this.id = `node-${nodeCounter++}`;
                    this.render();
                }

                render() {
                    const div = document.createElement('div');
                    div.className = 'tree-node';
                    div.id = this.id;
                    div.innerText = this.val;
                    div.style.left = `${this.x}%`;
                    div.style.top = `${this.y}px`;
                    treeContainer.appendChild(div);
                }
            }

            function drawLine(x1, y1, x2, y2, id) {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', `${x1}%`);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', `${x2}%`);
                line.setAttribute('y2', y2);
                line.setAttribute('class', 'tree-line');
                line.setAttribute('id', id);
                treeSvg.appendChild(line);
            }

            function disableControls(disable) {
                isAnimating = disable;
                btnInsert.disabled = disable;
                btnInorder.disabled = disable;
                btnPreorder.disabled = disable;
                btnPostorder.disabled = disable;
                btnClear.disabled = disable;
                nodeValueInput.disabled = disable;
            }

            async function insertNode() {
                const val = parseInt(nodeValueInput.value);
                if (isNaN(val)) return;
                if (isAnimating) return;
                disableControls(true);
                
                renderCode('insert');
                traversalOutput.innerHTML = 'Traversal Output: [ ]';
                
                highlightLine(0); await sleep(600);
                
                if (root === null) {
                    highlightLine(1); await sleep(600);
                    highlightLine(2); await sleep(600);
                    root = new TreeNode(val, 50, 40, 1);
                    document.getElementById(root.id).classList.add('new-node');
                    statusText.innerHTML = `Inserted ${val} as root.`;
                    await sleep(800);
                    document.getElementById(root.id).classList.remove('new-node');
                    highlightLine(-1);
                    disableControls(false);
                    nodeValueInput.value = '';
                    return;
                }

                let curr = root;
                let dx = 25; // initial horizontal offset percentage
                
                while (true) {
                    highlightLine(1); await sleep(400); // if null check (fails)
                    
                    document.getElementById(curr.id).classList.add('highlight');
                    statusText.innerHTML = `Comparing ${val} with ${curr.val}...`;
                    highlightLine(4); await sleep(800);
                    
                    if (val < curr.val) {
                        statusText.innerHTML = `${val} is less than ${curr.val}, going left.`;
                        highlightLine(5); await sleep(600);
                        document.getElementById(curr.id).classList.remove('highlight');
                        
                        if (curr.left === null) {
                            highlightLine(1); await sleep(400);
                            highlightLine(2); await sleep(600);
                            
                            const newX = curr.x - (dx / curr.level);
                            const newY = curr.y + 60;
                            curr.left = new TreeNode(val, newX, newY, curr.level + 1);
                            drawLine(curr.x, curr.y, newX, newY, `line-${curr.id}-L`);
                            
                            document.getElementById(curr.left.id).classList.add('new-node');
                            statusText.innerHTML = `Inserted ${val} to the left of ${curr.val}.`;
                            await sleep(800);
                            document.getElementById(curr.left.id).classList.remove('new-node');
                            break;
                        }
                        curr = curr.left;
                    } else if (val > curr.val) {
                        highlightLine(6); await sleep(600);
                        statusText.innerHTML = `${val} is greater than ${curr.val}, going right.`;
                        highlightLine(7); await sleep(600);
                        document.getElementById(curr.id).classList.remove('highlight');
                        
                        if (curr.right === null) {
                            highlightLine(1); await sleep(400);
                            highlightLine(2); await sleep(600);
                            
                            const newX = curr.x + (dx / curr.level);
                            const newY = curr.y + 60;
                            curr.right = new TreeNode(val, newX, newY, curr.level + 1);
                            drawLine(curr.x, curr.y, newX, newY, `line-${curr.id}-R`);
                            
                            document.getElementById(curr.right.id).classList.add('new-node');
                            statusText.innerHTML = `Inserted ${val} to the right of ${curr.val}.`;
                            await sleep(800);
                            document.getElementById(curr.right.id).classList.remove('new-node');
                            break;
                        }
                        curr = curr.right;
                    } else {
                        statusText.innerHTML = `${val} already exists in the tree.`;
                        document.getElementById(curr.id).classList.remove('highlight');
                        break;
                    }
                }

                highlightLine(9); await sleep(600);
                highlightLine(-1);
                disableControls(false);
                nodeValueInput.value = '';
            }

            async function traverse(node, type, arr) {
                if(node === null) {
                    highlightLine(1); await sleep(300);
                    return;
                }
                
                document.getElementById(node.id).classList.add('highlight');
                highlightLine(1); await sleep(300);
                
                if (type === 'preorder') {
                    highlightLine(2); await sleep(500);
                    arr.push(node.val);
                    traversalOutput.innerHTML = `Traversal Output: [ <span class="text-warning">${arr.join(', ')}</span> ]`;
                    statusText.innerHTML = `Visiting ${node.val}`;
                }
                
                let lineLeft = type === 'inorder' ? 2 : (type === 'preorder' ? 3 : 2);
                highlightLine(lineLeft); await sleep(400);
                document.getElementById(node.id).classList.remove('highlight');
                await traverse(node.left, type, arr);
                document.getElementById(node.id).classList.add('highlight');

                if (type === 'inorder') {
                    highlightLine(3); await sleep(500);
                    arr.push(node.val);
                    traversalOutput.innerHTML = `Traversal Output: [ <span class="text-warning">${arr.join(', ')}</span> ]`;
                    statusText.innerHTML = `Visiting ${node.val}`;
                }

                let lineRight = type === 'inorder' ? 4 : (type === 'preorder' ? 4 : 3);
                highlightLine(lineRight); await sleep(400);
                document.getElementById(node.id).classList.remove('highlight');
                await traverse(node.right, type, arr);
                document.getElementById(node.id).classList.add('highlight');

                if (type === 'postorder') {
                    highlightLine(4); await sleep(500);
                    arr.push(node.val);
                    traversalOutput.innerHTML = `Traversal Output: [ <span class="text-warning">${arr.join(', ')}</span> ]`;
                    statusText.innerHTML = `Visiting ${node.val}`;
                }
                
                document.getElementById(node.id).classList.remove('highlight');
            }

            async function runTraversal(type) {
                if (!root) {
                    statusText.innerHTML = `Tree is empty. Cannot traverse.`;
                    return;
                }
                if (isAnimating) return;
                disableControls(true);
                renderCode(type);
                
                let arr = [];
                traversalOutput.innerHTML = `Traversal Output: [ ]`;
                statusText.innerHTML = `Starting ${type} traversal...`;
                highlightLine(0); await sleep(600);
                
                await traverse(root, type, arr);
                
                statusText.innerHTML = `${type.charAt(0).toUpperCase() + type.slice(1)} traversal complete.`;
                highlightLine(-1);
                disableControls(false);
            }

            btnInsert.addEventListener('click', insertNode);
            nodeValueInput.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') insertNode();
            });

            btnInorder.addEventListener('click', () => runTraversal('inorder'));
            btnPreorder.addEventListener('click', () => runTraversal('preorder'));
            btnPostorder.addEventListener('click', () => runTraversal('postorder'));

            btnClear.addEventListener('click', () => {
                if(!isAnimating) {
                    root = null;
                    treeContainer.querySelectorAll('.tree-node').forEach(e => e.remove());
                    treeSvg.innerHTML = '';
                    statusText.innerHTML = "Tree cleared.";
                    traversalOutput.innerHTML = 'Traversal Output: [ ]';
                    codeBlock.innerHTML = "Select an operation to see the code.";
                }
            });
        });
    </script>
</body>
</html>
