<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA with C - Sorting Visualization</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .bars-container {
            height: 300px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 2px;
            padding: 20px 0;
            border-bottom: 2px solid var(--bs-secondary);
        }
        .bar {
            width: 30px;
            background-color: var(--bs-primary);
            transition: height 0.2s ease, background-color 0.2s ease;
            border-radius: 4px 4px 0 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 5px;
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .code-block {
            background-color: #282c34;
            color: #abb2bf;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            height: 100%;
            overflow-y: auto;
        }
        .code-line {
            padding: 2px 5px;
            border-radius: 3px;
        }
        .code-line.active {
            background-color: #3e4451;
            color: #e5c07b;
            font-weight: bold;
            border-left: 3px solid #e5c07b;
        }
        .bar.comparing { background-color: var(--bs-warning) !important; color: black; }
        .bar.swapping { background-color: var(--bs-danger) !important; }
        .bar.sorted { background-color: var(--bs-success) !important; }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-primary mb-0">Sorting Algorithms</h2>
            <a href="visualization.html" class="btn btn-outline-secondary rounded-pill shadow-sm"><i class="bi bi-arrow-left"></i> Back</a>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 h-100" style="border-radius: 15px;">
                    <div class="card-body p-4 d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                            <select id="algoSelect" class="form-select w-auto fw-bold">
                                <option value="bubble">Bubble Sort</option>
                                <option value="selection">Selection Sort</option>
                                <option value="insertion">Insertion Sort</option>
                            </select>
                            
                            <div class="d-flex gap-2">
                                <button id="btnGenerate" class="btn btn-secondary rounded-pill"><i class="bi bi-shuffle"></i> Randomize</button>
                                <button id="btnStep" class="btn btn-warning rounded-pill"><i class="bi bi-step-forward"></i> Step</button>
                                <button id="btnPlay" class="btn btn-primary rounded-pill"><i class="bi bi-play-fill"></i> Play</button>
                            </div>
                        </div>

                        <div class="bars-container flex-grow-1" id="barsContainer"></div>
                        
                        <div class="d-flex align-items-center justify-content-center gap-3 mt-4">
                            <label class="fw-bold text-muted small">Array Size:</label>
                            <input type="range" class="form-range" id="sizeRange" min="5" max="30" value="15" style="width: 100px;">
                            <label class="fw-bold text-muted small ms-3">Speed:</label>
                            <input type="range" class="form-range" id="speedRange" min="50" max="1000" value="300" style="width: 100px;">
                        </div>
                        <div class="text-center mt-3">
                            <h5 id="statusText" class="text-muted fw-semibold">Ready to sort.</h5>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-lg border-0 h-100" style="border-radius: 15px;">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3"><i class="bi bi-terminal"></i> Dry Run Code</h5>
                        <div class="code-block" id="codeBlock"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="nav-script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('barsContainer');
            const codeBlock = document.getElementById('codeBlock');
            const algoSelect = document.getElementById('algoSelect');
            const btnGenerate = document.getElementById('btnGenerate');
            const btnPlay = document.getElementById('btnPlay');
            const btnStep = document.getElementById('btnStep');
            const sizeRange = document.getElementById('sizeRange');
            const speedRange = document.getElementById('speedRange');
            const statusText = document.getElementById('statusText');

            let array = [];
            let bars = [];
            let operations = [];
            let currentStep = 0;
            let isPlaying = false;
            let playTimer = null;

            const algorithms = {
                bubble: {
                    code: [
                        "for (int i = 0; i < n - 1; i++) {",
                        "    for (int j = 0; j < n - i - 1; j++) {",
                        "        if (arr[j] > arr[j + 1]) {",
                        "            swap(&arr[j], &arr[j + 1]);",
                        "        }",
                        "    }",
                        "}"
                    ],
                    generate: () => {
                        let tempArr = [...array];
                        for(let i=0; i<tempArr.length-1; i++){
                            for(let j=0; j<tempArr.length-i-1; j++){
                                operations.push({ type: 'compare', indices: [j, j+1], line: 2, msg: `Comparing ${tempArr[j]} and ${tempArr[j+1]}` });
                                if(tempArr[j] > tempArr[j+1]){
                                    operations.push({ type: 'swap', indices: [j, j+1], line: 3, msg: `Swapping ${tempArr[j]} and ${tempArr[j+1]}` });
                                    let t = tempArr[j]; tempArr[j] = tempArr[j+1]; tempArr[j+1] = t;
                                }
                            }
                            operations.push({ type: 'sorted', index: tempArr.length-1-i, line: 0, msg: `${tempArr[tempArr.length-1-i]} is in its correct position.` });
                        }
                        operations.push({ type: 'sorted', index: 0, line: 0, msg: `Array is fully sorted.` });
                    }
                },
                selection: {
                    code: [
                        "for (int i = 0; i < n - 1; i++) {",
                        "    int min_idx = i;",
                        "    for (int j = i + 1; j < n; j++) {",
                        "        if (arr[j] < arr[min_idx])",
                        "            min_idx = j;",
                        "    }",
                        "    swap(&arr[min_idx], &arr[i]);",
                        "}"
                    ],
                    generate: () => {
                        let tempArr = [...array];
                        for(let i=0; i<tempArr.length-1; i++){
                            let min_idx = i;
                            operations.push({ type: 'highlight', indices: [min_idx], line: 1, msg: `Assume min index is ${min_idx} (value: ${tempArr[min_idx]})` });
                            for(let j=i+1; j<tempArr.length; j++){
                                operations.push({ type: 'compare', indices: [j, min_idx], line: 3, msg: `Comparing ${tempArr[j]} with current min ${tempArr[min_idx]}` });
                                if(tempArr[j] < tempArr[min_idx]){
                                    min_idx = j;
                                    operations.push({ type: 'highlight', indices: [min_idx], line: 4, msg: `New min index found: ${min_idx}` });
                                }
                            }
                            if(min_idx !== i) {
                                operations.push({ type: 'swap', indices: [i, min_idx], line: 6, msg: `Swapping ${tempArr[i]} and minimum ${tempArr[min_idx]}` });
                                let t = tempArr[i]; tempArr[i] = tempArr[min_idx]; tempArr[min_idx] = t;
                            }
                            operations.push({ type: 'sorted', index: i, line: 0, msg: `${tempArr[i]} is now sorted.` });
                        }
                        operations.push({ type: 'sorted', index: tempArr.length-1, line: 0, msg: `Array is fully sorted.` });
                    }
                },
                insertion: {
                    code: [
                        "for (int i = 1; i < n; i++) {",
                        "    int key = arr[i];",
                        "    int j = i - 1;",
                        "    while (j >= 0 && arr[j] > key) {",
                        "        arr[j + 1] = arr[j];",
                        "        j = j - 1;",
                        "    }",
                        "    arr[j + 1] = key;",
                        "}"
                    ],
                    generate: () => {
                        let tempArr = [...array];
                        operations.push({ type: 'sorted', index: 0, line: 0, msg: `First element is conceptually sorted.` });
                        for(let i=1; i<tempArr.length; i++){
                            let key = tempArr[i];
                            let j = i - 1;
                            operations.push({ type: 'highlight', indices: [i], line: 1, msg: `Key selected: ${key}` });
                            while(j >= 0) {
                                operations.push({ type: 'compare', indices: [j, j+1], line: 3, msg: `Comparing key ${key} with ${tempArr[j]}` });
                                if(tempArr[j] > key) {
                                    operations.push({ type: 'overwrite', index: j+1, val: tempArr[j], line: 4, msg: `Moving ${tempArr[j]} one position ahead` });
                                    tempArr[j+1] = tempArr[j];
                                    j--;
                                } else {
                                    break;
                                }
                            }
                            operations.push({ type: 'overwrite', index: j+1, val: key, line: 7, msg: `Placing key ${key} at position ${j+1}` });
                            tempArr[j+1] = key;
                            for(let k=0; k<=i; k++) {
                                operations.push({ type: 'sorted', index: k, line: 0, msg: '' });
                            }
                        }
                        operations.push({ type: 'msg', msg: `Array is fully sorted.` });
                    }
                }
            };

            function renderCode() {
                const algo = algoSelect.value;
                const codeLines = algorithms[algo].code;
                codeBlock.innerHTML = codeLines.map((line, i) => `<div class="code-line" id="line-${i}">${line.replace(/ /g, '&nbsp;')}</div>`).join('');
            }

            function highlightLine(lineNum) {
                document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
                if(lineNum !== undefined && lineNum >= 0) {
                    const line = document.getElementById(`line-${lineNum}`);
                    if(line) line.classList.add('active');
                }
            }

            function generateArray() {
                container.innerHTML = '';
                array = [];
                bars = [];
                const size = parseInt(sizeRange.value);
                const width = Math.max(10, 600 / size - 4);
                for(let i=0; i<size; i++){
                    const val = Math.floor(Math.random() * 250) + 20;
                    array.push(val);
                    const bar = document.createElement('div');
                    bar.classList.add('bar');
                    bar.style.height = `${val}px`;
                    bar.style.width = `${width}px`;
                    if(size <= 20) bar.innerText = val;
                    container.appendChild(bar);
                    bars.push(bar);
                }
                resetState();
            }

            function resetState() {
                operations = [];
                currentStep = 0;
                isPlaying = false;
                clearInterval(playTimer);
                btnPlay.innerHTML = '<i class="bi bi-play-fill"></i> Play';
                statusText.innerText = "Ready to sort.";
                document.querySelectorAll('.bar').forEach(b => {
                    b.className = 'bar';
                });
                renderCode();
                algorithms[algoSelect.value].generate();
            }

            function applyStep() {
                if(currentStep >= operations.length) {
                    togglePlay(false);
                    return;
                }
                
                // Clear highlights
                bars.forEach(b => {
                    b.classList.remove('comparing', 'swapping');
                });

                const op = operations[currentStep];
                highlightLine(op.line);
                if(op.msg) statusText.innerText = op.msg;

                if(op.type === 'compare' || op.type === 'highlight') {
                    op.indices.forEach(i => bars[i].classList.add('comparing'));
                } else if (op.type === 'swap') {
                    const [i, j] = op.indices;
                    bars[i].classList.add('swapping');
                    bars[j].classList.add('swapping');
                    // Swap heights and text
                    let h = bars[i].style.height;
                    let t = bars[i].innerText;
                    bars[i].style.height = bars[j].style.height;
                    bars[i].innerText = bars[j].innerText;
                    bars[j].style.height = h;
                    bars[j].innerText = t;
                } else if (op.type === 'overwrite') {
                    bars[op.index].classList.add('swapping');
                    bars[op.index].style.height = `${op.val}px`;
                    if(bars.length <= 20) bars[op.index].innerText = op.val;
                } else if (op.type === 'sorted') {
                    bars[op.index].classList.add('sorted');
                }
                currentStep++;
            }

            function togglePlay(forceStop) {
                if(isPlaying || forceStop) {
                    isPlaying = false;
                    clearInterval(playTimer);
                    btnPlay.innerHTML = '<i class="bi bi-play-fill"></i> Play';
                    btnStep.disabled = false;
                } else {
                    if(currentStep >= operations.length) {
                        // Reshuffle and play
                        generateArray();
                    }
                    isPlaying = true;
                    btnPlay.innerHTML = '<i class="bi bi-pause-fill"></i> Pause';
                    btnStep.disabled = true;
                    const speed = 1050 - parseInt(speedRange.value);
                    playTimer = setInterval(applyStep, speed);
                }
            }

            btnGenerate.addEventListener('click', generateArray);
            algoSelect.addEventListener('change', () => {
                generateArray();
            });
            sizeRange.addEventListener('input', generateArray);
            btnStep.addEventListener('click', applyStep);
            btnPlay.addEventListener('click', () => togglePlay());
            speedRange.addEventListener('input', () => {
                if(isPlaying) {
                    clearInterval(playTimer);
                    const speed = 1050 - parseInt(speedRange.value);
                    playTimer = setInterval(applyStep, speed);
                }
            });

            generateArray();
        });
    </script>
</body>
</html>
