<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA with C - Hashing Visualization</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .hash-table {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .hash-bucket {
            border: 2px solid var(--bs-primary);
            border-radius: 8px;
            overflow: hidden;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            transition: all 0.3s;
        }
        .hash-index {
            background-color: var(--bs-primary);
            color: white;
            font-weight: bold;
            padding: 5px;
            font-size: 0.9rem;
        }
        .hash-val {
            padding: 15px 5px;
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hash-bucket.highlight {
            border-color: var(--bs-warning);
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.6);
            transform: scale(1.05);
        }
        .hash-bucket.highlight .hash-index {
            background-color: var(--bs-warning);
            color: black;
        }
        .hash-bucket.success {
            border-color: var(--bs-success);
            box-shadow: 0 0 15px rgba(25, 135, 84, 0.6);
        }
        .hash-bucket.success .hash-index {
            background-color: var(--bs-success);
        }
        .hash-bucket.collision {
            border-color: var(--bs-danger);
            animation: shake 0.5s;
        }
        .hash-bucket.collision .hash-index {
            background-color: var(--bs-danger);
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        .code-block {
            background-color: #282c34;
            color: #abb2bf;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            height: 350px;
            overflow-y: auto;
            white-space: pre;
        }
        .code-line {
            padding: 2px 5px;
            border-radius: 3px;
        }
        .code-line.active {
            background-color: #3e4451;
            color: #e5c07b;
            font-weight: bold;
            border-left: 3px solid #e5c07b;
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-warning mb-0" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.1);">Hashing Visualization</h2>
            <a href="visualization.html" class="btn btn-outline-secondary rounded-pill shadow-sm"><i class="bi bi-arrow-left"></i> Back</a>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 h-100" style="border-radius: 15px;">
                    <div class="card-body p-4 d-flex flex-column">
                        <div class="row g-2 mb-4 align-items-end">
                            <div class="col-md-3">
                                <label class="form-label fw-bold small text-muted">Table Size:</label>
                                <input type="number" id="tableSize" class="form-control" value="10" min="5" max="20">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold small text-muted">Value to Insert:</label>
                                <input type="number" id="hashValue" class="form-control" placeholder="e.g. 42">
                            </div>
                            <div class="col-md-6 d-flex gap-2 align-items-end">
                                <button id="btnInsert" class="btn btn-warning rounded-pill flex-grow-1 shadow-sm fw-bold">Insert</button>
                                <button id="btnInit" class="btn btn-outline-secondary rounded-pill shadow-sm">Reset Table</button>
                            </div>
                        </div>

                        <div class="hash-table" id="hashTableContainer">
                            <!-- Buckets injected here -->
                        </div>
                        
                        <div class="text-center mt-4 p-3 bg-light rounded shadow-sm border">
                            <h4 id="statusText" class="text-dark fw-bold mb-0" style="font-family: monospace;">h(x) = x % size</h4>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-lg border-0 h-100" style="border-radius: 15px;">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3"><i class="bi bi-terminal"></i> Linear Probing</h5>
                        <div class="code-block" id="codeBlock"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="nav-script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('hashTableContainer');
            const tableSizeInput = document.getElementById('tableSize');
            const hashValueInput = document.getElementById('hashValue');
            const btnInsert = document.getElementById('btnInsert');
            const btnInit = document.getElementById('btnInit');
            const statusText = document.getElementById('statusText');
            const codeBlock = document.getElementById('codeBlock');

            let table = [];
            let size = 10;
            let isAnimating = false;

            const codeSnippet = [
                "void insert(int val) {",
                "    int key = val % size;",
                "    if (table[key] == EMPTY) {",
                "        table[key] = val;",
                "        return;",
                "    }",
                "    // Collision occurred!",
                "    int original_key = key;",
                "    while (table[key] != EMPTY) {",
                "        key = (key + 1) % size;",
                "        if (key == original_key) {",
                "            printf(\"Table is full!\");",
                "            return;",
                "        }",
                "    }",
                "    table[key] = val;",
                "}"
            ];

            const sleep = ms => new Promise(r => setTimeout(r, ms));

            function initTable() {
                size = parseInt(tableSizeInput.value) || 10;
                table = new Array(size).fill(null);
                container.innerHTML = '';
                
                for(let i=0; i<size; i++) {
                    const bucket = document.createElement('div');
                    bucket.className = 'hash-bucket';
                    bucket.id = `bucket-${i}`;
                    bucket.innerHTML = `
                        <div class="hash-index">${i}</div>
                        <div class="hash-val" id="val-${i}"></div>
                    `;
                    container.appendChild(bucket);
                }
                
                codeBlock.innerHTML = codeSnippet.map((line, i) => `<div class="code-line" id="line-${i}">${line.replace(/ /g, '&nbsp;')}</div>`).join('');
                statusText.innerHTML = `h(x) = x % ${size}`;
            }

            function highlightLine(lineNum) {
                document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
                if (lineNum !== undefined && lineNum >= 0) {
                    const line = document.getElementById(`line-${lineNum}`);
                    if (line) line.classList.add('active');
                }
            }

            function resetBucketStyles() {
                document.querySelectorAll('.hash-bucket').forEach(b => {
                    b.classList.remove('highlight', 'success', 'collision');
                });
            }

            async function insertValue() {
                if(isAnimating) return;
                const val = parseInt(hashValueInput.value);
                if(isNaN(val)) return;

                isAnimating = true;
                btnInsert.disabled = true;
                resetBucketStyles();
                
                highlightLine(0); await sleep(600);
                
                let key = val % size;
                // handle negative mod
                if(key < 0) key += size;

                statusText.innerHTML = `h(${val}) = ${val} % ${size} = <strong class="text-primary">${key}</strong>`;
                highlightLine(1); await sleep(800);
                
                let bucketElement = document.getElementById(`bucket-${key}`);
                bucketElement.classList.add('highlight');
                
                highlightLine(2); await sleep(800);

                if (table[key] === null) {
                    statusText.innerHTML = `Index ${key} is empty. Inserting...`;
                    highlightLine(3); await sleep(600);
                    
                    table[key] = val;
                    document.getElementById(`val-${key}`).innerText = val;
                    bucketElement.classList.remove('highlight');
                    bucketElement.classList.add('success');
                    
                    highlightLine(4); await sleep(600);
                } else {
                    statusText.innerHTML = `Collision at index ${key}! Linear probing initiated.`;
                    bucketElement.classList.remove('highlight');
                    bucketElement.classList.add('collision');
                    highlightLine(6); await sleep(800);
                    
                    const original_key = key;
                    highlightLine(7); await sleep(400);

                    while(table[key] !== null) {
                        highlightLine(8); await sleep(400);
                        bucketElement.classList.remove('collision');
                        
                        key = (key + 1) % size;
                        statusText.innerHTML = `Checking index ${key}...`;
                        highlightLine(9); await sleep(600);
                        
                        bucketElement = document.getElementById(`bucket-${key}`);
                        bucketElement.classList.add('highlight');
                        
                        highlightLine(10); await sleep(400);
                        if (key === original_key) {
                            highlightLine(11); await sleep(600);
                            statusText.innerHTML = `<span class="text-danger fw-bold">Table is full! Cannot insert ${val}.</span>`;
                            bucketElement.classList.remove('highlight');
                            isAnimating = false;
                            btnInsert.disabled = false;
                            hashValueInput.value = '';
                            return;
                        }
                        
                        if(table[key] !== null) {
                            bucketElement.classList.remove('highlight');
                            bucketElement.classList.add('collision');
                        }
                    }
                    
                    statusText.innerHTML = `Found empty slot at index ${key}. Inserting...`;
                    highlightLine(15); await sleep(600);
                    table[key] = val;
                    document.getElementById(`val-${key}`).innerText = val;
                    bucketElement.classList.remove('highlight');
                    bucketElement.classList.add('success');
                }
                
                highlightLine(-1);
                isAnimating = false;
                btnInsert.disabled = false;
                hashValueInput.value = '';
                await sleep(1000);
                resetBucketStyles();
                statusText.innerHTML = `h(x) = x % ${size}`;
            }

            btnInit.addEventListener('click', () => {
                if(!isAnimating) initTable();
            });

            btnInsert.addEventListener('click', insertValue);
            hashValueInput.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') insertValue();
            });

            initTable();
        });
    </script>
</body>
</html>
