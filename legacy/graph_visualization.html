<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA with C - Graph Visualization</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .graph-container {
            height: 450px;
            background-color: var(--bs-light);
            border-radius: 10px;
            border: 1px solid #dee2e6;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
        }
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .graph-line {
            stroke: var(--bs-secondary);
            stroke-width: 3;
            transition: stroke 0.3s, stroke-width 0.3s;
        }
        .graph-line.highlight {
            stroke: var(--bs-warning);
            stroke-width: 5;
        }
        .graph-node {
            position: absolute;
            width: 45px;
            height: 45px;
            background-color: white;
            border: 3px solid var(--bs-primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            transform: translate(-50%, -50%);
            z-index: 2;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            user-select: none;
        }
        .graph-node:hover {
            transform: translate(-50%, -50%) scale(1.1);
            border-color: var(--bs-info);
        }
        .graph-node.selected {
            border-color: var(--bs-warning);
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.8);
            background-color: #fff3cd;
        }
        .graph-node.visited {
            border-color: var(--bs-success);
            background-color: #d1e7dd;
            color: var(--bs-success);
        }
        .code-block {
            background-color: #282c34;
            color: #abb2bf;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            height: 450px;
            overflow-y: auto;
            white-space: pre;
        }
        .code-line {
            padding: 2px 5px;
            border-radius: 3px;
        }
        .code-line.active {
            background-color: #3e4451;
            color: #e5c07b;
            font-weight: bold;
            border-left: 3px solid #e5c07b;
        }
        .traversal-output {
            min-height: 40px;
            font-family: monospace;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-secondary mb-0">Graph Visualization</h2>
            <a href="visualization.html" class="btn btn-outline-secondary rounded-pill shadow-sm"><i class="bi bi-arrow-left"></i> Back</a>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 h-100" style="border-radius: 15px;">
                    <div class="card-body p-4 d-flex flex-column">
                        
                        <div class="alert alert-info py-2 px-3 mb-3 d-flex align-items-center gap-2">
                            <i class="bi bi-info-circle-fill"></i>
                            <span class="small fw-semibold">Click canvas to add nodes. Click two nodes to connect them. Select a starting node before running BFS/DFS.</span>
                        </div>

                        <div class="d-flex gap-2 mb-3 flex-wrap">
                            <button id="btnBfs" class="btn btn-secondary rounded-pill flex-grow-1 shadow-sm fw-bold">Run BFS</button>
                            <button id="btnDfs" class="btn btn-secondary rounded-pill flex-grow-1 shadow-sm fw-bold">Run DFS</button>
                            <button id="btnClear" class="btn btn-outline-danger rounded-pill shadow-sm px-4">Clear All</button>
                        </div>
                        
                        <div class="bg-dark text-white p-2 rounded mb-3 text-center traversal-output" id="traversalOutput">
                            Traversal Output: [ ]
                        </div>

                        <div class="graph-container" id="graphContainer">
                            <svg id="graphSvg"></svg>
                            <!-- Nodes injected here -->
                        </div>
                        
                        <div class="text-center mt-3">
                            <h5 id="statusText" class="text-muted fw-semibold mb-0">Ready. Click on the canvas area above to begin.</h5>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-lg border-0 h-100" style="border-radius: 15px;">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3"><i class="bi bi-terminal"></i> Dry Run Code</h5>
                        <div class="code-block" id="codeBlock">Select BFS or DFS to see the algorithm code.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="nav-script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const graphContainer = document.getElementById('graphContainer');
            const graphSvg = document.getElementById('graphSvg');
            const btnBfs = document.getElementById('btnBfs');
            const btnDfs = document.getElementById('btnDfs');
            const btnClear = document.getElementById('btnClear');
            const statusText = document.getElementById('statusText');
            const codeBlock = document.getElementById('codeBlock');
            const traversalOutput = document.getElementById('traversalOutput');

            let nodes = []; // array of objects {id, x, y}
            let edges = []; // array of {u, v}
            let adjList = {};
            let isAnimating = false;
            let selectedNodeId = null;

            const codeSnippets = {
                bfs: [
                    "void BFS(int start) {",
                    "    bool visited[MAX] = {false};",
                    "    int queue[MAX], front = 0, rear = 0;",
                    "    visited[start] = true;",
                    "    queue[rear++] = start;",
                    "    while (front < rear) {",
                    "        int u = queue[front++];",
                    "        printf(\"%d \", u);",
                    "        for (int v : adj[u]) {",
                    "            if (!visited[v]) {",
                    "                visited[v] = true;",
                    "                queue[rear++] = v;",
                    "            }",
                    "        }",
                    "    }",
                    "}"
                ],
                dfs: [
                    "void DFS(int u, bool visited[]) {",
                    "    visited[u] = true;",
                    "    printf(\"%d \", u);",
                    "    for (int v : adj[u]) {",
                    "        if (!visited[v]) {",
                    "            DFS(v, visited);",
                    "        }",
                    "    }",
                    "}"
                ]
            };

            const sleep = ms => new Promise(r => setTimeout(r, ms));

            function renderCode(type) {
                codeBlock.innerHTML = codeSnippets[type].map((line, i) => `<div class="code-line" id="line-${i}">${line.replace(/ /g, '&nbsp;')}</div>`).join('');
            }

            function highlightLine(lineNum) {
                document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
                if (lineNum !== undefined && lineNum >= 0) {
                    const line = document.getElementById(`line-${lineNum}`);
                    if (line) {
                        line.classList.add('active');
                        line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }

            function drawEdge(u, v) {
                const nodeU = nodes[u];
                const nodeV = nodes[v];
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', `${nodeU.x}px`);
                line.setAttribute('y1', `${nodeU.y}px`);
                line.setAttribute('x2', `${nodeV.x}px`);
                line.setAttribute('y2', `${nodeV.y}px`);
                line.setAttribute('class', 'graph-line');
                line.setAttribute('id', `edge-${u}-${v}`);
                graphSvg.appendChild(line);
            }

            function createNode(x, y) {
                if(isAnimating) return;
                const id = nodes.length;
                nodes.push({ id, x, y });
                adjList[id] = [];
                
                const div = document.createElement('div');
                div.className = 'graph-node';
                div.id = `node-${id}`;
                div.innerText = id;
                div.style.left = `${x}px`;
                div.style.top = `${y}px`;
                
                div.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if(isAnimating) return;
                    
                    if (selectedNodeId === null) {
                        // Select this node
                        selectedNodeId = id;
                        div.classList.add('selected');
                        statusText.innerHTML = `Node ${id} selected. Click another node to connect, or click Run BFS/DFS.`;
                    } else if (selectedNodeId === id) {
                        // Deselect
                        selectedNodeId = null;
                        div.classList.remove('selected');
                        statusText.innerHTML = `Node deselected.`;
                    } else {
                        // Connect selected to this
                        if (!adjList[selectedNodeId].includes(id)) {
                            adjList[selectedNodeId].push(id);
                            adjList[id].push(selectedNodeId);
                            drawEdge(selectedNodeId, id);
                        }
                        // Deselect
                        document.getElementById(`node-${selectedNodeId}`).classList.remove('selected');
                        selectedNodeId = null;
                        statusText.innerHTML = `Edge created.`;
                    }
                });
                
                graphContainer.appendChild(div);
                statusText.innerHTML = `Node ${id} created.`;
            }

            graphContainer.addEventListener('click', (e) => {
                if (e.target === graphContainer) {
                    const rect = graphContainer.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    createNode(x, y);
                }
            });

            function disableControls(disable) {
                isAnimating = disable;
                btnBfs.disabled = disable;
                btnDfs.disabled = disable;
                btnClear.disabled = disable;
            }

            function resetGraphVisuals() {
                nodes.forEach(n => document.getElementById(`node-${n.id}`).className = 'graph-node');
                document.querySelectorAll('.graph-line').forEach(l => l.classList.remove('highlight'));
                if(selectedNodeId !== null) {
                    document.getElementById(`node-${selectedNodeId}`).classList.add('selected');
                }
            }

            async function runBFS() {
                if (selectedNodeId === null) {
                    statusText.innerHTML = `<span class="text-danger fw-bold">Please select a starting node first!</span>`;
                    return;
                }
                disableControls(true);
                resetGraphVisuals();
                renderCode('bfs');
                let arr = [];
                traversalOutput.innerHTML = `Traversal Output: [ ]`;
                
                const startNode = selectedNodeId;
                
                highlightLine(0); await sleep(500);
                let visited = new Array(nodes.length).fill(false);
                highlightLine(1); await sleep(500);
                let queue = [];
                highlightLine(2); await sleep(500);
                
                visited[startNode] = true;
                highlightLine(3); await sleep(500);
                
                queue.push(startNode);
                document.getElementById(`node-${startNode}`).classList.add('selected'); // queued
                highlightLine(4); await sleep(500);
                
                while(queue.length > 0) {
                    highlightLine(5); await sleep(500);
                    
                    let u = queue.shift();
                    highlightLine(6); await sleep(500);
                    
                    document.getElementById(`node-${u}`).classList.remove('selected');
                    document.getElementById(`node-${u}`).classList.add('visited');
                    arr.push(u);
                    traversalOutput.innerHTML = `Traversal Output: [ <span class="text-warning">${arr.join(', ')}</span> ]`;
                    statusText.innerHTML = `Visiting Node ${u}`;
                    highlightLine(7); await sleep(600);
                    
                    highlightLine(8); await sleep(500);
                    for(let v of adjList[u]) {
                        highlightLine(9); await sleep(400);
                        if(!visited[v]) {
                            
                            // Highlight edge
                            let edge = document.getElementById(`edge-${u}-${v}`) || document.getElementById(`edge-${v}-${u}`);
                            if(edge) edge.classList.add('highlight');
                            
                            visited[v] = true;
                            highlightLine(10); await sleep(400);
                            
                            queue.push(v);
                            document.getElementById(`node-${v}`).classList.add('selected'); // queue highlight
                            highlightLine(11); await sleep(400);
                        }
                    }
                }
                
                statusText.innerHTML = `BFS Complete.`;
                highlightLine(14); await sleep(500);
                highlightLine(-1);
                disableControls(false);
            }

            async function dfsHelper(u, visited, arr) {
                visited[u] = true;
                highlightLine(1); await sleep(500);
                
                document.getElementById(`node-${u}`).classList.remove('selected');
                document.getElementById(`node-${u}`).classList.add('visited');
                arr.push(u);
                traversalOutput.innerHTML = `Traversal Output: [ <span class="text-warning">${arr.join(', ')}</span> ]`;
                statusText.innerHTML = `Visiting Node ${u}`;
                highlightLine(2); await sleep(600);
                
                highlightLine(3); await sleep(500);
                for(let v of adjList[u]) {
                    highlightLine(4); await sleep(400);
                    if(!visited[v]) {
                        // Highlight edge
                        let edge = document.getElementById(`edge-${u}-${v}`) || document.getElementById(`edge-${v}-${u}`);
                        if(edge) edge.classList.add('highlight');
                        
                        document.getElementById(`node-${v}`).classList.add('selected'); // discovered highlight
                        
                        highlightLine(5); await sleep(500);
                        await dfsHelper(v, visited, arr);
                        highlightLine(3); await sleep(400);
                    }
                }
            }

            async function runDFS() {
                if (selectedNodeId === null) {
                    statusText.innerHTML = `<span class="text-danger fw-bold">Please select a starting node first!</span>`;
                    return;
                }
                disableControls(true);
                resetGraphVisuals();
                renderCode('dfs');
                let arr = [];
                traversalOutput.innerHTML = `Traversal Output: [ ]`;
                
                const startNode = selectedNodeId;
                
                let visited = new Array(nodes.length).fill(false);
                highlightLine(0); await sleep(600);
                
                await dfsHelper(startNode, visited, arr);
                
                statusText.innerHTML = `DFS Complete.`;
                highlightLine(8); await sleep(500);
                highlightLine(-1);
                disableControls(false);
            }

            btnBfs.addEventListener('click', runBFS);
            btnDfs.addEventListener('click', runDFS);
            
            btnClear.addEventListener('click', () => {
                if(!isAnimating) {
                    nodes = [];
                    adjList = {};
                    edges = [];
                    selectedNodeId = null;
                    graphContainer.querySelectorAll('.graph-node').forEach(e => e.remove());
                    graphSvg.innerHTML = '';
                    statusText.innerHTML = "Graph cleared. Click canvas to add nodes.";
                    traversalOutput.innerHTML = 'Traversal Output: [ ]';
                    codeBlock.innerHTML = "Select BFS or DFS to see the algorithm code.";
                }
            });
        });
    </script>
</body>
</html>
